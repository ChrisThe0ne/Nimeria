spring:
  datasource:
    password: ''
    username: root
    url: jdbc:mysql://localhost:3306/nimeria
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: 'true'
    hibernate:
      ddl-auto: create
    show-sql: 'true'
  mail:
    host: localhost
    port: 1025
    username: username
    password: password

    properties:
      mail:
        smtp:
          ssl:
            trust: "*"
          auth: true
          starttls:
            enable: true
          connectiontimeout: 50000
          timeout: 30000
          writetimeout: 50000

server:
  error:
    include-binding-errors: always
    include-message: always